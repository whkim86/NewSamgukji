name: Acquire modern geographic layers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install geopandas shapely
      - run: python tools/terrain/fetch_layers.py
      - uses: actions/upload-artifact@v4
        with:
          name: modern-geo-layers
          path: public/data/henan-central-*.json
