<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신 삼국지 WEB</title><link rel="stylesheet" href="/src/ui/style.css"></head><body><header><strong>新 삼국지 WEB</strong><span>PRE-STEP 01-B · 가상 지형</span><span id="fps">FPS —</span></header><main><aside><h2>통합 월드</h2><p>사전 기술 검증용 가상 지형</p><button id="reset" disabled>카메라 초기화</button><label><input id="shadow" type="checkbox" checked disabled> 그림자</label><p>실제 중국 지형 및 거리 아님</p></aside><section id="viewport"><div id="status" role="status">3D 엔진 로딩 중…</div></section><aside><h2>렌더링 정보</h2><pre id="debug">대기 중</pre><p>도시 및 군대: 미구현</p></aside></main><footer>좌클릭 드래그: 이동 · 우클릭 드래그: 회전 · 휠: 확대/축소 <span>v0.1.2</span></footer><script>window.addEventListener('error',e=>{document.getElementById('status').hidden=false;document.getElementById('status').textContent='오류: '+(e.message||'리소스 로딩 실패')},true);window.addEventListener('unhandledrejection',e=>{document.getElementById('status').hidden=false;document.getElementById('status').textContent='오류: '+e.reason});</script><script type="module" src="/src/bootstrap.js"></script></body></html>
