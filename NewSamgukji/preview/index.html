<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신 삼국지 WEB</title><style>*{box-sizing:border-box}body{margin:0;background:#17201d;color:#e8dfc7;font:14px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}header,footer{display:flex;align-items:center;gap:24px;padding:12px 18px;background:#222c27;border-bottom:1px solid #796d4d}header strong{font-size:22px;color:#e9c889}#fps,footer span{margin-left:auto}main{flex:1;min-height:0;display:grid;grid-template-columns:180px minmax(0,1fr) 190px}aside{padding:16px;background:#202923}h2{font-size:16px;color:#e9c889}p{line-height:1.6;color:#b9c1ae}button{background:#485643;color:#fff;border:1px solid #a29b76;padding:9px;cursor:pointer;width:100%;margin-bottom:16px}label{display:block}#viewport{position:relative;overflow:hidden;min-width:0}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;z-index:2;top:16px;left:16px;right:16px;padding:14px;background:#202923e8;white-space:pre-wrap}#status[hidden]{display:none}pre{white-space:pre-wrap;font:13px monospace;line-height:1.7}@media(max-width:800px){main{grid-template-columns:1fr}aside{display:none}header,footer{gap:8px;font-size:11px}header strong{font-size:16px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><strong>新 삼국지 WEB</strong><span>PRE-STEP 01 · 가상 지형</span><span id="fps">FPS —</span></header><main><aside><h2>통합 월드</h2><p>사전 기술 검증용 가상 지형</p><button id="reset" disabled>카메라 초기화</button><label><input id="shadow" type="checkbox" checked disabled> 그림자</label><p>실제 중국 지형 및 거리 아님</p></aside><section id="viewport"><div id="status" role="status">3D 엔진 로딩 중…</div></section><aside><h2>렌더링 정보</h2><pre id="debug">대기 중</pre><p>도시 및 군대: 미구현</p></aside></main><footer>좌클릭 드래그: 이동 · 우클릭 드래그: 회전 · 휠: 확대/축소 <span>v0.1.0</span></footer><script>window.addEventListener('error',e=>{document.getElementById('status').hidden=false;document.getElementById('status').textContent='오류: '+(e.message||'리소스 로딩 실패')},true);window.addEventListener('unhandledrejection',e=>{document.getElementById('status').hidden=false;document.getElementById('status').textContent='오류: '+e.reason});</script><script type="module">try { const T=await import('three'); const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
function riverX(z){return 65+95*Math.sin(z/180)+25*Math.sin(z/65)}
function heightAt(x,z){const ridge=(cx,cz,sx,sz,h)=>h*Math.exp(-(((x-cx)/sx)**2)-((z-cz)/sz)**2);const hills=ridge(-340,-240,145,310,155)+ridge(350,260,155,220,110)+ridge(-430,330,100,130,65);const rough=(Math.sin(x*.043)*Math.cos(z*.036)+Math.sin(x*.091+z*.067)*.35)*Math.min(12,2+hills*.09);const d=Math.abs(x-riverX(z));const blend=Math.min(1,Math.max(0,(d-15)/35));return -5+(9+hills+rough)*blend;}
function makeWorld(scene,c){const g=new T.PlaneGeometry(c.size,c.size,c.segments,c.segments);g.rotateX(-Math.PI/2);const p=g.attributes.position,colors=[];const green=new T.Color(0x788c50),rock=new T.Color(0x77766a),sand=new T.Color(0xa79c71);for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=heightAt(x,z);p.setY(i,h);const col=green.clone().lerp(rock,Math.min(1,Math.max(0,(h-35)/100)));if(Math.abs(x-riverX(z))<35)col.lerp(sand,.65);col.multiplyScalar(.94+.06*Math.sin(x*.12+z*.09));colors.push(col.r,col.g,col.b)}g.setAttribute('color',new T.Float32BufferAttribute(colors,3));g.computeVertexNormals();const land=new T.Mesh(g,new T.MeshStandardMaterial({vertexColors:true,roughness:1}));land.receiveShadow=true;land.castShadow=true;scene.add(land);const verts=[],idx=[];for(let i=0;i<=240;i++){const z=-c.size/2+c.size*i/240,x=riverX(z);verts.push(x-20,-1,z,x+20,-1,z);if(i<240){const k=i*2;idx.push(k,k+2,k+1,k+1,k+2,k+3)}}const water=new T.BufferGeometry();water.setAttribute('position',new T.Float32BufferAttribute(verts,3));water.setIndex(idx);water.computeVertexNormals();scene.add(new T.Mesh(water,new T.MeshStandardMaterial({color:0x427e91,roughness:.35,side:T.DoubleSide})));}
function setupCamera(camera,canvas,c){const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.12;controls.minDistance=c.camera.minDistance;controls.maxDistance=c.camera.maxDistance;controls.maxPolarAngle=Math.PI*.40;controls.mouseButtons={LEFT:T.MOUSE.PAN,MIDDLE:T.MOUSE.DOLLY,RIGHT:T.MOUSE.ROTATE};controls.screenSpacePanning=false;function reset(){controls.target.set(0,0,0);camera.position.set(0,c.camera.initialDistance*.8,c.camera.initialDistance*.6);controls.update()}reset();return {controls,reset,update(){controls.update();const old=controls.target.clone();controls.target.x=T.MathUtils.clamp(old.x,-c.size/2,c.size/2);controls.target.z=T.MathUtils.clamp(old.z,-c.size/2,c.size/2);controls.target.y=0;camera.position.add(controls.target.clone().sub(old));camera.position.y=Math.max(camera.position.y,heightAt(camera.position.x,camera.position.z)+12);camera.lookAt(controls.target)}}}


const $=id=>document.getElementById(id);const status=$('status');
async function start(){const c={"size": 1200, "segments": 160, "camera": {"minDistance": 65, "maxDistance": 1800, "initialDistance": 1050}, "pixelRatioCap": 1.5, "shadowMapSize": 1024};const viewport=$('viewport');const canvas=document.createElement('canvas');const context=canvas.getContext('webgl2',{antialias:true});if(!context)throw Error('WebGL 2를 사용할 수 없습니다. 브라우저 하드웨어 가속 및 GPU 드라이버를 확인하세요.');const renderer=new T.WebGLRenderer({canvas,context,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,c.pixelRatioCap));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;viewport.append(canvas);const scene=new T.Scene();scene.background=new T.Color(0xb6c6ce);scene.fog=new T.Fog(0xb6c6ce,1100,2700);const camera=new T.PerspectiveCamera(48,1,1,4000);scene.add(new T.HemisphereLight(0xfff4dd,0x65745a,2));const sun=new T.DirectionalLight(0xffe4b8,2.5);sun.position.set(-500,800,350);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-650,right:650,top:650,bottom:-650,near:10,far:1800});sun.shadow.camera.updateProjectionMatrix();sun.shadow.mapSize.set(c.shadowMapSize,c.shadowMapSize);sun.shadow.bias=-.0005;scene.add(sun);makeWorld(scene,c);const cam=setupCamera(camera,canvas,c);function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(viewport);resize();$('reset').disabled=false;$('reset').onclick=cam.reset;$('shadow').disabled=false;$('shadow').onchange=e=>{renderer.shadowMap.enabled=e.target.checked;scene.traverse(o=>{if(o.isMesh)o.material.needsUpdate=true})};let stopped=false;canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stopped=true;status.hidden=false;status.textContent='WebGL 연결 손실. 페이지를 새로고침하세요.'});let last=performance.now(),frames=0;function frame(now){if(stopped)return;try{cam.update();renderer.render(scene,camera);frames++;if(now-last>=500){const fps=frames*1000/(now-last);$('fps').textContent=`FPS ${fps.toFixed(1)}`;$('debug').textContent=`WebGL 2\n카메라 거리 ${camera.position.distanceTo(cam.controls.target).toFixed(0)}\n좌표 ${cam.controls.target.x.toFixed(0)}, ${cam.controls.target.z.toFixed(0)}\nDraw calls ${renderer.info.render.calls}\nTriangles ${renderer.info.render.triangles}`;last=now;frames=0}status.hidden=true;requestAnimationFrame(frame)}catch(e){status.hidden=false;status.textContent='렌더링 오류: '+e.message;console.error(e)}}requestAnimationFrame(frame)}start().catch(e=>{status.hidden=false;status.textContent='초기화 실패: '+e.message;console.error(e)});

} catch(e){const s=document.getElementById('status');s.hidden=false;s.textContent='라이브러리 로딩 실패: '+e.message;} </script></body></html>
